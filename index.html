<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./index.css">
    <script src="./index.js"></script>
    <script src="https://kit.fontawesome.com/d79943a144.js" crossorigin="anonymous"></script>
    <title>NextFlick</title>
</head>
<body>
    <nav>
        <figure class="nav__logo--wrapper">
            <img src="./logo-light(1).png" alt="" class="nav__logo--img">
        </figure>
        <ul class="nav__link--list">
            <li class="nav__link">Home</li>
            <li class="nav__link">Browse</li>
            <li class="nav__link nav__link--primary">Search</li>
        </ul>
    </nav>
    <section id="landing-page">
        <div class="container">
            <div class="landing__content">
                <img src="./logo(2).png" alt="" class="landing__logo">
                <div class="landing__search">
                    <input type="text" placeholder="Find Your Next Movie" class="landing__search--input"></input>
                    <button class="landing__search--btn">
                        <i class="fa solid fa-magnifying-glass"></i>
                    </button>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
