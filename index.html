<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./index.css">
    <script src="./index.js"></script>
    <script src="https://kit.fontawesome.com/d79943a144.js" crossorigin="anonymous"></script>
    <title>NextFlick</title>
</head>
<body>
    <nav>
        <div class="nav__content">
            <figure class="nav__logo--wrapper">
                <img src="./assets/logo-light(1).png" alt="" class="nav__logo--img">
                <h2 class="nav__logo--name">Next<span class="crimson">Flick</span></h2>
            </figure>
            <ul class="nav__link--list">
                <li><a href="./index.html" class="nav__link">Home</a></li>
                <li><a href="./search.html" class="nav__link">Find your movie</a></li>
                <li><a href="./search.html" class="nav__link nav__link--primary">Browse</a></li>
            </ul>
        </div>
    </nav>
    <section id="landing">
        <div class="container">
            <div class="row">
                <div class="landing__content">
                    <img src="./assets/logo-light(2).png" alt="" class="landing__logo">
                    <div class="landing__search">
                        <input type="text" placeholder="Search movies..." class="landing__search--input"></input>
                        <button class="landing__search--btn">
                            <i class="fa solid fa-magnifying-glass"></i>
                        </button>
                    </div>
                    <h3 class="landing__description">
                        <span class="crimson">Discover, search, and explore</span> thousands of films tailored to your taste—all in one sleek, user-friendly platform.
                    </h3>
                </div>
            </div>
        </div>
    </section>
    <footer>
        <div class="container">
            <div class="footer__links">
                <a href="./index.html">Home</a>
                <a href="#">About</a>
                <a href="#">API</a>
                <a href="#">Contact</a>

            <div class="footer__socials">
                <a href="#" class="footer__social">GitHub</a>
                <a href="#" class="footer__social">LinkedIn</a>
            </div>
            <p class="footer__copyright">
                &copy; 2026 Mikayla Esparza
            </p>
        </div>
    </footer>

</html>
